  - generic [ref=f4e85]:
    - heading "Three steps, and only one of them touches a server" [level=2] [ref=f4e86]
    - list [ref=f4e87]:
      - listitem [ref=f4e88]:
        - generic [ref=f4e89]: "1"
        - heading "Track on-device" [level=3] [ref=f4e90]
        - paragraph [ref=f4e91]: The extension reads the active tab through Chrome's tabs API and writes domain-and-duration entries straight into chrome.storage.local. It pauses when your machine goes idle or locks. No page content, no network request.
      - listitem [ref=f4e92]:
        - generic [ref=f4e93]: "2"
        - heading "Aggregate, then analyze" [level=3] [ref=f4e94]
        - paragraph [ref=f4e95]: "Each day your entries collapse into one summary: minutes per category, a focus score, and your top domains. That summary — and nothing else — is what the AI receives."
      - listitem [ref=f4e96]:
        - generic [ref=f4e97]: "3"
        - heading "Read the insight" [level=3] [ref=f4e98]
        - paragraph [ref=f4e99]: The analysis comes back to the extension popup, and to this dashboard if you sign in, where daily and 7- or 30-day trends accumulate.
  - generic [ref=f4e101]:
    - heading "Privacy is the architecture here, not a policy page" [level=2] [ref=f4e102]
    - paragraph [ref=f4e103]: "Other trackers upload your history and promise to behave. EchoFocus structurally cannot: raw entries are written to chrome.storage.local on your machine, and no code path ships them anywhere."
