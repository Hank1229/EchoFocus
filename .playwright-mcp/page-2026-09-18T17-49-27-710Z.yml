  - generic [ref=f3e66]:
    - heading "Three steps, and only one of them touches a server" [level=2] [ref=f3e67]
    - list [ref=f3e68]:
      - listitem [ref=f3e69]:
        - text: "1"
        - heading "Track on-device" [level=3] [ref=f3e70]
        - paragraph [ref=f3e71]: The extension reads the active tab through Chrome's tabs API and writes domain-and-duration entries straight into chrome.storage.local. It pauses when your machine goes idle or locks. No page content, no network request.
      - listitem [ref=f3e72]:
        - text: "2"
        - heading "Aggregate, then analyze" [level=3] [ref=f3e73]
        - paragraph [ref=f3e74]: "Each day your entries collapse into one summary: minutes per category, a focus score, and your top domains. That summary — and nothing else — is what the AI receives."
      - listitem [ref=f3e75]:
        - text: "3"
        - heading "Read the insight" [level=3] [ref=f3e76]
        - paragraph [ref=f3e77]: The analysis comes back to the extension popup, and to this dashboard if you sign in, where daily and 7- or 30-day trends accumulate.
  - generic [ref=f3e79]:
    - heading "Privacy is the architecture here, not a policy page" [level=2] [ref=f3e80]
    - paragraph [ref=f3e81]: "Other trackers upload your history and promise to behave. EchoFocus structurally cannot: raw entries are written to chrome.storage.local on your machine, and no code path ships them anywhere."
