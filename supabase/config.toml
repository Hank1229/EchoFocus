# EchoFocus — local Supabase CLI configuration.
# For the full schema reference, see:
# https://supabase.com/docs/guides/local-development/cli/config
#
# `project_id` is a local Docker-namespace label, but we keep it identical to
# the remote project ref so `supabase link` / CLI output unambiguously ties
# this local stack to the right hosted project (org kozmgttayzfehcuoljle,
# region us-west-2).
project_id = "fnrzeeocityhfunfrlmh"

[api]
enabled = true
# Port for the local REST/PostgREST API.
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
# Port for the local Postgres instance.
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Verified against the remote project (2026-09-12): the Supabase dashboard
# reports postgres_engine "17" / server version 17.6.1.063, so local must
# match Postgres 17 or `db diff` / migration drift checks will be misleading.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
# Port for the local Supabase Studio UI.
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Local email testing server (Inbucket). send-email-report is exercised via
# Resend directly in this project, not SMTP, but Auth's own emails (magic
# links, confirmations) still route through here in local dev.
[inbucket]
enabled = true
# Port for the Inbucket web UI.
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# EchoFocus has two auth surfaces: the web dashboard (Next.js on
# localhost:3000) and the extension's chrome.identity OAuth flow. site_url is
# the primary one used to build links in auth emails.
site_url = "http://localhost:3000"
# Redirect allow-list: the web dashboard's dev origin, plus the extension's
# chrome.identity.launchWebAuthFlow callback. Chrome mints a per-extension
# id.chromiumapp.org host, so the wildcard is required rather than one fixed
# hostname (apps/extension/src/lib/auth.ts calls chrome.identity.getRedirectURL()
# to get the exact value at runtime).
additional_redirect_urls = ["http://localhost:3000", "https://*.chromiumapp.org/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# EchoFocus only uses Google as an auth provider (both web login and the
# extension's chrome.identity flow). Every other external provider is left
# at its CLI-generated default (disabled) and omitted here for brevity.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# DO NOT commit the actual secret — set it via the SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET
# env var (see supabase/.env in CLAUDE.md) before running `supabase start`.
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
# Google's OIDC nonce check has historically been flaky against the local
# auth server; flip this to true if local Google sign-in fails nonce
# validation while it works fine against the hosted project.
skip_nonce_check = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true
# `per_worker` gives hot reload while iterating on the edge functions below.
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Both Edge Functions implement their own auth and must NOT be gated by the
# platform's JWT check:
# - ai-analyze: expects a user JWT but does its own validation via Zod +
#   the consume_ai_generation() rate limiter, and returns its own 401s.
# - send-email-report: verifies the JWT itself and only ever emails the
#   address on that verified JWT.
# verify_jwt = false here MUST match the production Edge Function settings
# (set via `supabase functions deploy --no-verify-jwt` or the dashboard),
# otherwise local and prod auth behavior diverge.
[functions.ai-analyze]
enabled = true
verify_jwt = false

[functions.send-email-report]
enabled = true
verify_jwt = false

[analytics]
enabled = false
