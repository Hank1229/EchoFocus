name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Check locale parity (en / zh-TW)
        run: node scripts/check-locales.mjs

      - name: Test all packages
        run: pnpm -r --if-present test

      - name: Build extension
        run: pnpm build:extension
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_SUPABASE_FUNCTIONS_URL: https://ci-placeholder.supabase.co/functions/v1
          VITE_DASHBOARD_URL: https://ci-placeholder.example.com

      - name: Build web
        run: pnpm --filter @echofocus/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Screenshot regression: the same Playwright image the local
  # `pnpm test:visual` uses, so baselines compare pixel for pixel.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - name: Fonts and dependencies
        run: sh tests/visual/setup-container.sh

      - name: Visual regression (124 screens)
        run: pnpm test:visual:run

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            tests/visual/test-results
            tests/visual/playwright-report
          retention-days: 14
