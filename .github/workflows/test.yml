name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Check locale parity (en / zh-TW)
        run: node scripts/check-locales.mjs

      - name: Test all packages
        run: pnpm -r --if-present test

      - name: Build extension
        run: pnpm build:extension
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_SUPABASE_FUNCTIONS_URL: https://ci-placeholder.supabase.co/functions/v1
          VITE_DASHBOARD_URL: https://ci-placeholder.example.com

      - name: Build web
        run: pnpm --filter @echofocus/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
